<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>Settings</h2>
            <label for="rows">Rows:</label>
            <input type="number" id="rows" value="10" min="1" max="100">
            <label for="cols">Columns:</label>
            <input type="number" id="cols" value="10" min="1" max="100">

            <label for="algorithm">Algorithm:</label>
            <select id="algorithm">
                <option value="recursiveBacktracker">Recursive Backtracker</option>
                <option value="prim">Prim's Algorithm</option>
                <option value="kruskal">Kruskal's Algorithm</option>
                <option value="eller">Eller's Algorithm</option>
                <option value="binaryTree">Binary Tree Algorithm</option>
                <option value="sidewinder">Sidewinder Algorithm</option>
                <option value="wilsons">Wilson's Algorithm</option>
                <option value="aldousBroder">Aldous-Broder Algorithm</option>
                <option value="huntAndKill">Hunt and Kill Algorithm</option>
                <option value="recursiveDivision">Recursive Division</option>
                <option value="random">Randomized Algorithm</option>
            </select>

            <button id="generateMaze">Generate Maze</button>    
        </div>
        <div class="canvas-area">
            <canvas id="mazeCanvas" width="800" height="800"></canvas>
        </div>

    <script type="module" src="TestScript.js"></script>
</body>
</html>
